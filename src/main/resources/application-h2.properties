# Profile "h2": chạy thử KHÔNG cần cài MySQL.
# Chạy: mvn spring-boot:run -Dspring-boot.run.profiles=h2
# Dữ liệu lưu ở thư mục data/ (xóa thư mục này để reset dữ liệu mẫu)
spring.datasource.url=jdbc:h2:file:./data/utelearn-h2;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=update
