spring.application.name=UTELearn
server.port=8080

# ================= DATABASE (MySQL) =================
# Tạo database bằng file database/utelearn.sql, hoặc để Hibernate tự tạo bảng (ddl-auto=update)
spring.datasource.url=jdbc:mysql://localhost:3306/utelearn?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Ho_Chi_Minh
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ================= THYMELEAF =================
# tắt cache để sửa HTML xong F5 là thấy luôn
spring.thymeleaf.cache=false

# ================= UPLOAD =================
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB
# thư mục lưu file khi CHƯA cấu hình Cloudinary
app.upload.dir=uploads

# ================= JWT =================
# secret là chuỗi base64 >= 32 byte. Khi deploy thật phải đổi bằng biến môi trường JWT_SECRET
app.jwt.secret=${JWT_SECRET:32M2EhZEBjsD9kWNJXJcEZVK/KhH/Lph7TkaxT8uNaNp+1oE842zaYn2TBy/ZMFQ}
# 1 ngày
app.jwt.expiration-ms=86400000
app.jwt.cookie-name=access_token

# ================= CLOUDINARY =================
# Lấy ở https://console.cloudinary.com -> Dashboard. Để trống thì file lưu vào thư mục uploads/
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# ================= EMAIL (quên mật khẩu) =================
# Gmail: bật xác minh 2 bước rồi tạo "Mật khẩu ứng dụng" (App Password). Để trống MAIL_USERNAME thì email chỉ in ra log (chế độ demo)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# địa chỉ web dùng để dựng link trong email
app.base-url=${APP_BASE_URL:http://localhost:8080}

# ================= VNPAY (sandbox) =================
# Đăng ký merchant test tại https://sandbox.vnpayment.vn/devreg/ -> email gửi TMN_CODE + HASH_SECRET. Để trống thì ẩn nút VNPay
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${app.base-url}/payment/vnpay-return

# ================= CHATBOT AI (tư vấn khóa học) =================
# Lấy API key tại https://console.anthropic.com -> đặt biến môi trường ANTHROPIC_API_KEY (không commit key).
# Để trống thì chatbot tự gợi ý khóa học theo từ khóa, không gọi AI.
ai.api-key=${ANTHROPIC_API_KEY:}
ai.model=${AI_MODEL:claude-haiku-4-5-20251001}
ai.api-url=${AI_API_URL:https://api.anthropic.com/v1/messages}
