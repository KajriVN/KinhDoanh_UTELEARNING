<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${form.id == null} ? 'Thêm bài học' : 'Sửa bài học')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{fragments/layout :: instructorMenu('courses')}"></div>
        </div>

        <div class="col-lg-9">
            <a th:href="@{/instructor/courses/{id}/curriculum(id=${course.id})}" class="small text-decoration-none">
                <i class="bi bi-arrow-left"></i> <span th:text="${course.title}"></span></a>
            <h3 class="page-title mt-1" th:text="${form.id == null} ? 'Thêm bài học' : 'Sửa bài học'">Bài học</h3>
            <p class="text-muted" th:text="'Thuộc: ' + ${section.title}"></p>

            <form class="box" method="post" enctype="multipart/form-data" th:object="${form}"
                  th:action="${form.id == null} ? @{/instructor/sections/{id}/lessons/new(id=${section.id})} : @{/instructor/lessons/{id}/edit(id=${form.id})}">
                <div class="mb-3">
                    <label class="form-label">Tên bài học <span class="text-danger">*</span></label>
                    <input class="form-control" th:field="*{title}"
                           th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{title}"></div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-7">
                        <label class="form-label">Link video (Youtube hoặc link mp4)</label>
                        <input class="form-control" th:field="*{videoUrl}" placeholder="https://www.youtube.com/watch?v=...">
                    </div>
                    <div class="col-md-5">
                        <label class="form-label">Hoặc upload video</label>
                        <input type="file" class="form-control" th:field="*{videoFile}" accept="video/*">
                    </div>
                    <div class="col-12 form-text mt-1">Nếu chọn file, video sẽ được upload lên Cloudinary và thay cho link.</div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Thời lượng (phút)</label>
                        <input type="number" min="0" class="form-control" th:field="*{durationMinutes}"
                               th:classappend="${#fields.hasErrors('durationMinutes')} ? 'is-invalid'">
                        <div class="invalid-feedback" th:errors="*{durationMinutes}"></div>
                    </div>
                    <div class="col-md-8 d-flex align-items-end">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" th:field="*{preview}" id="preview">
                            <label class="form-check-label" for="preview">Cho phép học thử (không cần mua)</label>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Nội dung / ghi chú bài học</label>
                    <textarea class="form-control" rows="8" th:field="*{content}"></textarea>
                </div>

                <div class="d-flex gap-2">
                    <button class="btn btn-primary" type="submit">Lưu bài học</button>
                    <a class="btn btn-outline-secondary" th:href="@{/instructor/courses/{id}/curriculum(id=${course.id})}">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
