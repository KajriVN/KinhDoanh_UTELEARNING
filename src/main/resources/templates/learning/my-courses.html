<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Khóa học của tôi')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h3 class="page-title mb-3">Khóa học của tôi</h3>

    <div class="row g-4">
        <div class="col-sm-6 col-lg-4 col-xl-3" th:each="e : ${enrollments}">
            <div class="card course-card h-100">
                <a th:href="@{/learn/{id}(id=${e.course.id})}">
                    <div th:replace="~{fragments/layout :: thumb(${e.course})}"></div>
                </a>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title">
                        <a th:href="@{/learn/{id}(id=${e.course.id})}" th:text="${e.course.title}">Tên khóa</a>
                    </h6>
                    <div class="small text-muted mb-3" th:text="'GV: ' + ${e.course.instructor.fullName}"></div>
                    <div class="mt-auto">
                        <div class="d-flex justify-content-between small mb-1">
                            <span>Tiến độ</span><span class="fw-semibold" th:text="${e.progressPercent} + '%'">0%</span>
                        </div>
                        <div class="progress mb-3" style="height: 8px">
                            <div class="progress-bar" th:classappend="${e.progressPercent == 100} ? 'bg-success'"
                                 th:style="|width: ${e.progressPercent}%|"></div>
                        </div>
                        <a class="btn btn-sm w-100" th:classappend="${e.progressPercent == 100} ? 'btn-outline-success' : 'btn-primary'"
                           th:href="@{/learn/{id}(id=${e.course.id})}"
                           th:text="${e.progressPercent == 0} ? 'Bắt đầu học' : (${e.progressPercent == 100} ? 'Đã hoàn thành - Học lại' : 'Học tiếp')">Học tiếp</a>
                        <a class="btn btn-sm btn-warning w-100 mt-2" th:if="${certificateCodes.containsKey(e.id)}"
                           th:href="@{/certificates/{c}(c=${certificateCodes.get(e.id)})}">
                            <i class="bi bi-patch-check me-1"></i>Xem chứng chỉ</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="box text-center py-5" th:if="${enrollments.empty}">
        <i class="bi bi-journal-x fs-1 text-muted d-block mb-2"></i>
        <p class="text-muted">Bạn chưa đăng ký khóa học nào.</p>
        <a class="btn btn-primary" th:href="@{/courses}">Khám phá khóa học</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
