<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Bài tập · ' + ${course.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <a th:href="@{/learn/{id}(id=${course.id})}" class="small text-decoration-none">
        <i class="bi bi-arrow-left"></i> Quay lại học bài</a>
    <h3 class="page-title mt-1">Bài tập</h3>
    <p class="text-muted" th:text="${course.title}"></p>

    <div class="alert alert-info small" th:if="${enrollment == null}">
        Bạn đang xem với quyền giảng viên/admin, không nộp bài được.
    </div>

    <div class="box text-center text-muted py-5" th:if="${assignments.empty}">
        <i class="bi bi-clipboard fs-1 d-block mb-2"></i>Khóa học chưa có bài tập nào.
    </div>

    <div class="box mb-3" th:each="a : ${assignments}" th:id="'a' + ${a.id}"
         th:with="sub=${mySubmissions[a.id]}">
        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2 mb-2">
            <div>
                <h5 class="fw-bold mb-1" th:text="${a.title}">Bài tập</h5>
                <div class="small text-muted">
                    <span th:if="${a.lesson != null}"><i class="bi bi-link-45deg"></i>
                        <a th:href="@{/learn/{c}(c=${course.id}, lessonId=${a.lesson.id})}" th:text="${a.lesson.title}"></a> ·</span>
                    Điểm tối đa <b th:text="${a.maxScore}"></b> ·
                    <span th:if="${a.dueDate != null}" th:classappend="${a.overdue} ? 'text-danger'">
                        Hạn nộp <span th:text="${@fmt.dateTime(a.dueDate)}"></span></span>
                    <span th:if="${a.dueDate == null}">Không giới hạn thời gian</span>
                </div>
            </div>
            <span th:if="${sub == null}" class="badge bg-secondary">Chưa nộp</span>
            <span th:if="${sub != null and sub.score == null}" class="badge bg-warning text-dark">Đã nộp · chờ chấm</span>
            <span th:if="${sub != null and sub.score != null}" class="badge bg-success fs-6"
                  th:text="${sub.score} + ' / ' + ${a.maxScore}"></span>
        </div>

        <div class="lesson-content mb-2" th:if="${a.description != null}" th:text="${a.description}"></div>
        <a th:if="${a.attachmentUrl != null}" th:href="${a.attachmentUrl}" target="_blank" class="btn btn-sm btn-outline-secondary mb-2">
            <i class="bi bi-paperclip"></i> Tải file đề bài</a>

        <!-- bài đã nộp -->
        <div class="border rounded p-3 bg-light small mb-2" th:if="${sub != null}">
            <div>
                Đã nộp lúc <b th:text="${@fmt.dateTime(sub.submittedAt)}"></b> ·
                <a th:href="${sub.fileUrl}" target="_blank"><i class="bi bi-download"></i> file của bạn</a>
            </div>
            <div class="text-muted" th:if="${sub.note != null and !sub.note.isBlank()}">
                Ghi chú: <span th:text="${sub.note}"></span></div>
            <div class="mt-2" th:if="${sub.score != null}">
                <div class="fw-semibold text-success">Nhận xét của giảng viên:</div>
                <div th:text="${sub.feedback != null and !sub.feedback.isBlank()} ? ${sub.feedback} : '(không có nhận xét)'"></div>
            </div>
        </div>

        <!-- form nộp / nộp lại: chỉ khi đã ghi danh, chưa chấm và chưa quá hạn -->
        <form th:if="${enrollment != null and !a.overdue and (sub == null or sub.score == null)}"
              method="post" enctype="multipart/form-data"
              th:action="@{/learn/{c}/assignments/{a}/submit(c=${course.id}, a=${a.id})}">
            <div class="row g-2 align-items-end">
                <div class="col-md-5">
                    <label class="form-label small mb-1"
                           th:text="${sub == null} ? 'File bài làm (tối đa 20MB)' : 'Chọn file mới (bỏ trống để giữ file cũ)'">File</label>
                    <input type="file" name="file" class="form-control form-control-sm"
                           accept=".pdf,.doc,.docx,.zip,.rar,.txt" th:required="${sub == null}">
                </div>
                <div class="col-md-5">
                    <label class="form-label small mb-1">Ghi chú cho giảng viên</label>
                    <input type="text" name="note" class="form-control form-control-sm" th:value="${sub?.note}">
                </div>
                <div class="col-md-2 d-grid">
                    <button class="btn btn-primary btn-sm" type="submit" th:text="${sub == null} ? 'Nộp bài' : 'Nộp lại'">Nộp bài</button>
                </div>
            </div>
        </form>
        <div class="small text-danger" th:if="${enrollment != null and a.overdue and sub == null}">
            Đã quá hạn nộp bài.</div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
