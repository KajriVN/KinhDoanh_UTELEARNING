<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt lại mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="auth-wrap">
        <div class="box p-4 p-md-5">
            <h3 class="fw-bold text-center mb-4">Đặt lại mật khẩu</h3>

            <div th:replace="~{fragments/layout :: flash}"></div>
            <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

            <!-- link hợp lệ -> hiện form -->
            <form th:if="${valid}" th:action="@{/auth/reset-password}" method="post">
                <input type="hidden" name="token" th:value="${token}">
                <div class="mb-3">
                    <label class="form-label">Mật khẩu mới</label>
                    <input type="password" name="password" class="form-control" minlength="6" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Nhập lại mật khẩu mới</label>
                    <input type="password" name="confirmPassword" class="form-control" minlength="6" required>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Đổi mật khẩu</button>
            </form>

            <div class="text-center" th:unless="${valid}">
                <a class="btn btn-outline-primary" th:href="@{/auth/forgot-password}">Yêu cầu liên kết mới</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
