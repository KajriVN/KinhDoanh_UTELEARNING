<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quên mật khẩu')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="auth-wrap">
        <div class="box p-4 p-md-5">
            <h3 class="fw-bold text-center mb-1">Quên mật khẩu</h3>
            <p class="text-center text-muted mb-4">Nhập email đã đăng ký, chúng tôi sẽ gửi liên kết đặt lại mật khẩu.</p>

            <div th:replace="~{fragments/layout :: flash}"></div>

            <form th:action="@{/auth/forgot-password}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="email@example.com" required autofocus>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Gửi liên kết đặt lại</button>
            </form>

            <p class="text-center mt-4 mb-0 small"><a th:href="@{/auth/login}">Quay lại đăng nhập</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
