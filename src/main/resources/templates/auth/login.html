<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container">
    <div class="auth-wrap">
        <div class="box p-4 p-md-5">
            <h3 class="fw-bold text-center mb-1">Đăng nhập</h3>
            <p class="text-center text-muted mb-4">Chào mừng bạn quay lại UTELearn</p>

            <div th:replace="~{fragments/layout :: flash}"></div>

            <form th:action="@{/auth/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" th:value="${email}"
                           placeholder="email@example.com" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label">Mật khẩu</label>
                    <input type="password" name="password" class="form-control" placeholder="••••••" required>
                </div>
                <div class="d-flex justify-content-end mb-3">
                    <!-- TODO (hand-off): trang quên mật khẩu -->
                    <span class="small text-muted" title="Chưa làm - xem hand-off.html">Quên mật khẩu? (sắp có)</span>
                </div>
                <button class="btn btn-primary w-100 py-2" type="submit">Đăng nhập</button>
            </form>

            <p class="text-center mt-4 mb-0 small">Chưa có tài khoản?
                <a th:href="@{/auth/register}">Đăng ký ngay</a></p>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
