<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Giỏ hàng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h3 class="page-title mb-3">Giỏ hàng <span class="text-muted fs-6" th:text="'(' + ${items.size()} + ' khóa học)'"></span></h3>

    <div class="row g-4" th:unless="${items.empty}">
        <div class="col-lg-8">
            <div class="box p-0">
                <div class="d-flex gap-3 p-3 border-bottom align-items-center" th:each="item : ${items}">
                    <a th:href="@{/courses/{id}(id=${item.course.id})}" style="width: 160px; flex-shrink: 0" class="rounded overflow-hidden">
                        <div th:replace="~{fragments/layout :: thumb(${item.course})}"></div>
                    </a>
                    <div class="flex-grow-1">
                        <a class="fw-semibold text-decoration-none text-dark" th:href="@{/courses/{id}(id=${item.course.id})}"
                           th:text="${item.course.title}">Tên khóa</a>
                        <div class="small text-muted" th:text="'GV: ' + ${item.course.instructor.fullName}"></div>
                        <div class="small text-muted" th:text="${item.course.totalLessons} + ' bài học · ' + ${item.course.level.label}"></div>
                    </div>
                    <div class="text-end">
                        <div class="price mb-2" th:text="${@fmt.money(item.course.price)}">0 đ</div>
                        <form th:action="@{/cart/remove/{id}(id=${item.course.id})}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit"><i class="bi bi-trash"></i> Xóa</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="box">
                <h5 class="fw-bold mb-3">Thanh toán</h5>
                <div class="d-flex justify-content-between mb-2">
                    <span>Tạm tính</span><span th:text="${@fmt.money(total)}">0 đ</span>
                </div>
                <div class="d-flex justify-content-between mb-2 small" th:classappend="${coupon == null} ? 'text-muted'">
                    <span>Giảm giá <b th:if="${coupon != null}" th:text="'(' + ${coupon.code} + ' -' + ${coupon.discountPercent} + '%)'"></b></span>
                    <span th:text="'- ' + ${@fmt.money(discount)}">0 đ</span>
                </div>
                <form method="get" th:action="@{/cart}" class="input-group input-group-sm mb-1">
                    <input class="form-control text-uppercase" name="couponCode" placeholder="Mã giảm giá"
                           th:value="${param.couponCode}">
                    <button class="btn btn-outline-primary" type="submit">Áp dụng</button>
                </form>
                <div class="small text-danger mb-2" th:if="${couponError != null}" th:text="${couponError}"></div>
                <div class="small text-success mb-2" th:if="${coupon != null}">Đã áp dụng mã giảm giá</div>
                <hr>
                <div class="d-flex justify-content-between fs-5 fw-bold mb-3">
                    <span>Tổng cộng</span><span class="price" th:text="${@fmt.money(finalTotal)}">0 đ</span>
                </div>
                <form th:action="@{/checkout}" method="post">
                    <input type="hidden" name="couponCode" th:if="${coupon != null}" th:value="${coupon.code}">
                    <button class="btn btn-primary w-100 py-2" type="submit">
                        <i class="bi bi-shield-lock me-1"></i>Tiến hành thanh toán</button>
                </form>
                <p class="small text-muted mt-3 mb-0">Sau khi thanh toán, khóa học sẽ xuất hiện trong mục "Khóa học của tôi".</p>
            </div>
        </div>
    </div>

    <div class="box text-center py-5" th:if="${items.empty}">
        <i class="bi bi-cart-x fs-1 text-muted d-block mb-2"></i>
        <p class="text-muted">Giỏ hàng của bạn đang trống.</p>
        <a class="btn btn-primary" th:href="@{/courses}">Khám phá khóa học</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
