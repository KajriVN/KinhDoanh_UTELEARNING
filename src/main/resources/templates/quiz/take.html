<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${quiz.title})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 820px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <a th:href="@{/learn/{id}(id=${course.id})}" class="small text-decoration-none"><i class="bi bi-arrow-left"></i> Về trang học</a>
    <h3 class="page-title mt-1" th:text="${quiz.title}">Quiz</h3>
    <p class="text-muted">
        <span th:text="${course.title}"></span> · Chương <span th:text="${quiz.section.position}"></span> ·
        <span th:text="${quiz.questions.size()}"></span> câu · Cần đúng ít nhất <b th:text="${quiz.passPercent} + '%'"></b> để đạt
    </p>

    <form method="post" th:action="@{/learn/{c}/quizzes/{q}/submit(c=${course.id}, q=${quiz.id})}">
        <div class="box mb-3" th:each="q, st : ${quiz.questions}">
            <div class="fw-semibold mb-2" th:text="'Câu ' + ${st.count} + ': ' + ${q.content}" style="white-space: pre-line"></div>
            <div class="form-check mb-1" th:each="opt, os : ${q.options}">
                <input class="form-check-input" type="radio" th:name="'q_' + ${q.id}" th:value="${os.count}"
                       th:id="'q' + ${q.id} + '_' + ${os.count}">
                <label class="form-check-label" th:for="'q' + ${q.id} + '_' + ${os.count}"
                       th:text="${#strings.substring('ABCD', os.index, os.index + 1)} + '. ' + ${opt}"></label>
            </div>
        </div>
        <button class="btn btn-primary px-4" type="submit"
                onclick="return confirm('Nộp bài? Câu chưa chọn sẽ tính là sai.')">Nộp bài</button>
    </form>

    <div class="box mt-4 p-0 table-responsive" th:unless="${history.empty}">
        <div class="p-3 pb-0"><h6 class="fw-bold mb-0">Các lần làm trước</h6></div>
        <table class="table align-middle mb-0">
            <tr th:each="a : ${history}">
                <td class="ps-3 small text-muted" th:text="${@fmt.dateTime(a.takenAt)}"></td>
                <td th:text="${a.score} + '/' + ${a.total} + ' (' + ${a.percent} + '%)'"></td>
                <td><span class="badge" th:classappend="${a.passed} ? 'bg-success' : 'bg-secondary'"
                          th:text="${a.passed} ? 'Đạt' : 'Chưa đạt'"></span></td>
                <td class="text-end pe-3">
                    <a th:href="@{/learn/{c}/quizzes/{q}/attempts/{a}(c=${course.id}, q=${quiz.id}, a=${a.id})}">Xem lại</a>
                </td>
            </tr>
        </table>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
