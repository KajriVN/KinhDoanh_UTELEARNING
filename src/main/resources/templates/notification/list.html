<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thông báo')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4" style="max-width: 820px">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="page-title mb-0">Thông báo</h3>
        <form method="post" th:action="@{/notifications/read-all}" th:if="${unreadCount > 0}">
            <button class="btn btn-outline-secondary btn-sm" type="submit"><i class="bi bi-check2-all"></i> Đánh dấu tất cả đã đọc</button>
        </form>
    </div>

    <div class="box p-0">
        <a class="d-flex gap-3 p-3 border-bottom text-decoration-none text-dark" th:each="n : ${notificationPage.content}"
           th:classappend="${!n.read} ? 'bg-primary-subtle'"
           th:href="@{/notifications/{id}/go(id=${n.id})}">
            <i class="bi bi-bell fs-4 text-primary"></i>
            <div class="flex-grow-1">
                <div class="fw-semibold" th:text="${n.title}"></div>
                <div class="small" th:text="${n.content}"></div>
                <div class="small text-muted" th:text="${@fmt.dateTime(n.createdAt)}"></div>
            </div>
            <span class="badge bg-danger align-self-start" th:unless="${n.read}">Mới</span>
        </a>
        <div class="text-center text-muted py-5" th:if="${notificationPage.empty}">
            <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>Bạn chưa có thông báo nào.
        </div>
    </div>
    <nav th:replace="~{fragments/layout :: pagination(${notificationPage})}"></nav>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
