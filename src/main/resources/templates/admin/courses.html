<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Duyệt khóa học')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{fragments/layout :: adminMenu('courses')}"></div>
        </div>

        <div class="col-lg-9">
            <h3 class="page-title mb-3">Khóa học</h3>

            <!-- tab lọc theo trạng thái -->
            <ul class="nav nav-pills mb-3 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${status == null} ? 'active'" th:href="@{/admin/courses}">Tất cả</a>
                </li>
                <li class="nav-item" th:each="s : ${statuses}">
                    <a class="nav-link" th:classappend="${status == s} ? 'active'" th:href="@{/admin/courses(status=${s})}">
                        <span th:text="${s.label}"></span>
                        <span th:if="${s.name() == 'PENDING' and pendingCount > 0}" class="badge bg-danger ms-1" th:text="${pendingCount}"></span>
                    </a>
                </li>
            </ul>

            <div class="box p-0 table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">Khóa học</th>
                        <th>Giảng viên</th>
                        <th>Giá</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-3">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${coursePage.content}">
                        <td class="ps-3">
                            <a class="fw-semibold text-decoration-none" th:href="@{/courses/{id}(id=${c.id})}" th:text="${c.title}"></a>
                            <div class="small text-muted" th:text="${c.totalLessons} + ' bài học · ' + ${c.category != null ? c.category.name : ''}"></div>
                        </td>
                        <td th:text="${c.instructor.fullName}"></td>
                        <td class="text-nowrap" th:text="${@fmt.price(c.price)}"></td>
                        <td><span class="badge bg-light text-dark border" th:text="${c.status.label}"></span></td>
                        <td class="text-end pe-3" style="min-width: 260px">
                            <th:block th:if="${c.status.name() == 'PENDING'}">
                                <form class="d-inline" method="post" th:action="@{/admin/courses/{id}/approve(id=${c.id})}">
                                    <button class="btn btn-sm btn-success" type="submit"><i class="bi bi-check-lg"></i> Duyệt</button>
                                </form>
                                <form class="d-inline-flex gap-1 mt-1" method="post" th:action="@{/admin/courses/{id}/reject(id=${c.id})}">
                                    <input class="form-control form-control-sm" name="reason" placeholder="Lý do từ chối" required>
                                    <button class="btn btn-sm btn-outline-danger" type="submit">Từ chối</button>
                                </form>
                            </th:block>
                        </td>
                    </tr>
                    <tr th:if="${coursePage.empty}">
                        <td colspan="5" class="text-center text-muted py-4">Không có khóa học.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:replace="~{fragments/layout :: pagination(${coursePage})}"></nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
