<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản lý người dùng')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{fragments/layout :: adminMenu('users')}"></div>
        </div>

        <div class="col-lg-9">
            <h3 class="page-title mb-3">Người dùng</h3>

            <form class="box d-flex flex-wrap gap-2 mb-3" th:action="@{/admin/users}" method="get">
                <input class="form-control" style="max-width: 320px" name="keyword" th:value="${keyword}"
                       placeholder="Tìm theo tên hoặc email">
                <select class="form-select" style="max-width: 200px" name="role">
                    <option value="">Tất cả vai trò</option>
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}" th:selected="${r == role}"></option>
                </select>
                <button class="btn btn-primary" type="submit"><i class="bi bi-search"></i> Tìm</button>
            </form>

            <div class="box p-0 table-responsive">
                <table class="table align-middle mb-0">
                    <thead class="table-light">
                    <tr>
                        <th class="ps-3">Người dùng</th>
                        <th>Vai trò</th>
                        <th>Ngày tạo</th>
                        <th>Trạng thái</th>
                        <th class="text-end pe-3">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${userPage.content}">
                        <td class="ps-3">
                            <div class="d-flex align-items-center gap-2">
                                <th:block th:replace="~{fragments/layout :: avatar(${u}, 36)}"></th:block>
                                <div>
                                    <div class="fw-semibold" th:text="${u.fullName}"></div>
                                    <div class="small text-muted" th:text="${u.email}"></div>
                                </div>
                            </div>
                        </td>
                        <td>
                            <!-- đổi vai trò: chọn xong tự submit -->
                            <form method="post" th:action="@{/admin/users/{id}/role(id=${u.id})}">
                                <select class="form-select form-select-sm" name="role" onchange="this.form.submit()"
                                        th:disabled="${u.id == currentUser.id}">
                                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r.label}"
                                            th:selected="${r == u.role}"></option>
                                </select>
                            </form>
                        </td>
                        <td class="small" th:text="${@fmt.date(u.createdAt)}"></td>
                        <td>
                            <span th:if="${u.enabled}" class="badge bg-success">Hoạt động</span>
                            <span th:unless="${u.enabled}" class="badge bg-danger">Đã khóa</span>
                        </td>
                        <td class="text-end pe-3">
                            <form method="post" th:action="@{/admin/users/{id}/toggle(id=${u.id})}" th:if="${u.id != currentUser.id}">
                                <button class="btn btn-sm" type="submit"
                                        th:classappend="${u.enabled} ? 'btn-outline-danger' : 'btn-outline-success'"
                                        th:text="${u.enabled} ? 'Khóa' : 'Mở khóa'"></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${userPage.empty}">
                        <td colspan="5" class="text-center text-muted py-4">Không tìm thấy người dùng.</td>
                    </tr>
                    </tbody>
                </table>
            </div>

            <nav th:replace="~{fragments/layout :: pagination(${userPage})}"></nav>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
