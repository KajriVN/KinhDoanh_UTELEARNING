<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Quản trị')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-4">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="row g-4">
        <div class="col-lg-3">
            <div th:replace="~{fragments/layout :: adminMenu('dashboard')}"></div>
        </div>

        <div class="col-lg-9">
            <h3 class="page-title mb-3">Tổng quan hệ thống</h3>

            <div class="row g-3 mb-4">
                <div class="col-sm-6 col-xl-4">
                    <div class="stat-card">
                        <div class="icon bg-primary-subtle text-primary"><i class="bi bi-mortarboard"></i></div>
                        <div><div class="value" th:text="${studentCount}">0</div><div class="small text-muted">Học viên</div></div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="stat-card">
                        <div class="icon bg-info-subtle text-info"><i class="bi bi-person-video3"></i></div>
                        <div><div class="value" th:text="${instructorCount}">0</div><div class="small text-muted">Giảng viên</div></div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="stat-card">
                        <div class="icon bg-success-subtle text-success"><i class="bi bi-journal-check"></i></div>
                        <div><div class="value" th:text="${publishedCount}">0</div><div class="small text-muted">Khóa học đã xuất bản</div></div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="stat-card">
                        <div class="icon bg-warning-subtle text-warning"><i class="bi bi-hourglass-split"></i></div>
                        <div><div class="value" th:text="${pendingCount}">0</div><div class="small text-muted">Khóa học chờ duyệt</div></div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="stat-card">
                        <div class="icon bg-secondary-subtle text-secondary"><i class="bi bi-receipt"></i></div>
                        <div><div class="value" th:text="${paidOrderCount}">0</div><div class="small text-muted">Đơn đã thanh toán</div></div>
                    </div>
                </div>
                <div class="col-sm-6 col-xl-4">
                    <div class="stat-card">
                        <div class="icon bg-danger-subtle text-danger"><i class="bi bi-cash-coin"></i></div>
                        <div><div class="value fs-5" th:text="${@fmt.money(revenue)}">0 đ</div><div class="small text-muted">Doanh thu</div></div>
                    </div>
                </div>
            </div>

            <div class="box">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h5 class="fw-bold mb-0">Khóa học chờ duyệt</h5>
                    <a th:href="@{/admin/courses(status='PENDING')}" class="small">Xem tất cả</a>
                </div>
                <table class="table align-middle mb-0" th:unless="${pendingCourses.empty}">
                    <tr th:each="c : ${pendingCourses}">
                        <td>
                            <a class="fw-semibold text-decoration-none" th:href="@{/courses/{id}(id=${c.id})}" th:text="${c.title}"></a>
                            <div class="small text-muted" th:text="'GV: ' + ${c.instructor.fullName}"></div>
                        </td>
                        <td th:text="${@fmt.price(c.price)}"></td>
                        <td class="text-end">
                            <form class="d-inline" method="post" th:action="@{/admin/courses/{id}/approve(id=${c.id})}">
                                <button class="btn btn-sm btn-success" type="submit">Duyệt</button>
                            </form>
                        </td>
                    </tr>
                </table>
                <div class="text-muted" th:if="${pendingCourses.empty}">Không có khóa học nào chờ duyệt.</div>
            </div>

            <div class="box mt-4">
                <h5 class="fw-bold mb-3">Doanh thu 12 tháng gần nhất</h5>
                <div style="height: 280px"><canvas id="revenueChart"></canvas></div>
            </div>

            <div class="row g-4 mt-0">
                <div class="col-xl-7">
                    <div class="box h-100">
                        <h5 class="fw-bold mb-3">Top 5 khóa bán chạy</h5>
                        <div style="height: 260px"><canvas id="topChart"></canvas></div>
                        <div class="text-muted small" th:if="${topLabels.empty}">Chưa có đơn hàng nào.</div>
                    </div>
                </div>
                <div class="col-xl-5">
                    <div class="box h-100">
                        <h5 class="fw-bold mb-3">Khóa học theo danh mục</h5>
                        <div style="height: 260px"><canvas id="categoryChart"></canvas></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script th:inline="javascript">
    const monthLabels = /*[[${monthLabels}]]*/ [];
    const monthValues = /*[[${monthValues}]]*/ [];
    const topLabels = /*[[${topLabels}]]*/ [];
    const topValues = /*[[${topValues}]]*/ [];
    const categoryLabels = /*[[${categoryLabels}]]*/ [];
    const categoryValues = /*[[${categoryValues}]]*/ [];

    if (window.Chart) {
        const vnd = v => Number(v).toLocaleString('vi-VN') + ' đ';
        new Chart(document.getElementById('revenueChart'), {
            type: 'bar',
            data: { labels: monthLabels, datasets: [{ label: 'Doanh thu', data: monthValues, backgroundColor: '#2563eb' }] },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false },
                tooltip: { callbacks: { label: c => vnd(c.parsed.y) } } },
                scales: { y: { beginAtZero: true, ticks: { callback: v => Number(v).toLocaleString('vi-VN') } } } }
        });
        new Chart(document.getElementById('topChart'), {
            type: 'bar',
            data: { labels: topLabels, datasets: [{ label: 'Lượt bán', data: topValues, backgroundColor: '#16a34a' }] },
            options: { indexAxis: 'y', maintainAspectRatio: false, plugins: { legend: { display: false } },
                scales: { x: { beginAtZero: true, ticks: { precision: 0 } } } }
        });
        new Chart(document.getElementById('categoryChart'), {
            type: 'doughnut',
            data: { labels: categoryLabels, datasets: [{ data: categoryValues,
                backgroundColor: ['#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d'] }] },
            options: { maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
        });
    }
</script>
</body>
</html>
