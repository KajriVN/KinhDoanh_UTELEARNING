<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Thanh toán')}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container py-5">
    <div class="mock-gateway">
        <div class="gateway-head">
            <div class="small opacity-75">CỔNG THANH TOÁN GIẢ LẬP (DEMO)</div>
            <div class="fs-4 fw-bold">UTELearn Pay</div>
        </div>
        <div class="box" style="border-radius: 0 0 14px 14px">
            <div class="alert alert-warning small">
                <i class="bi bi-info-circle me-1"></i>
                Đây là trang thanh toán giả lập để demo. Bấm "Xác nhận" coi như đã trả tiền thành công.
                Tích hợp VNPay thật xem file <b>hand-off.html</b>.
            </div>

            <table class="table table-sm">
                <tr><td class="text-muted">Mã đơn hàng</td><td class="text-end fw-semibold" th:text="${order.orderCode}"></td></tr>
                <tr><td class="text-muted">Khách hàng</td><td class="text-end" th:text="${order.user.fullName}"></td></tr>
                <tr><td class="text-muted">Ngày tạo</td><td class="text-end" th:text="${@fmt.dateTime(order.createdAt)}"></td></tr>
            </table>

            <h6 class="fw-bold mt-3">Khóa học</h6>
            <ul class="list-group list-group-flush mb-3">
                <li class="list-group-item d-flex justify-content-between px-0" th:each="item : ${order.items}">
                    <span th:text="${item.course.title}"></span>
                    <span th:text="${@fmt.money(item.price)}"></span>
                </li>
            </ul>

            <div class="d-flex justify-content-between fs-5 fw-bold mb-4">
                <span>Số tiền thanh toán</span>
                <span class="price" th:text="${@fmt.money(order.finalAmount)}"></span>
            </div>

            <div class="d-flex gap-2">
                <form class="flex-grow-1" th:action="@{/payment/{code}/confirm(code=${order.orderCode})}" method="post">
                    <button class="btn btn-primary w-100 py-2" type="submit"><i class="bi bi-check2-circle me-1"></i>Xác nhận thanh toán</button>
                </form>
                <form th:action="@{/payment/{code}/cancel(code=${order.orderCode})}" method="post">
                    <button class="btn btn-outline-secondary py-2" type="submit">Hủy</button>
                </form>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
